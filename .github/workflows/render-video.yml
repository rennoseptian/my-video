name: Render video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: "ID composition yang mau di-render"
        default: "MyComp"
        required: true

jobs:
  render:
    name: Render video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i
      - run: npx remotion render ${{ github.event.inputs.composition }} out/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
